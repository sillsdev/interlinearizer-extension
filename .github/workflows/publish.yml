name: Publish
run-name: Publish release v${{ github.event.inputs.version }} on ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. For verification purposes only; if the package.json version is different on the specified branch, the workflow will fail.'
        required: true
      studioVersion:
        description: "Version of the Paratext 10 Studio build that will be attached to this release, e.g. 0.5.0. Fills the release body's install steps. If empty, the body keeps its `<Studio version>` placeholder for a maintainer to edit by hand."
        required: false
      newVersionAfterPublishing:
        description: "Version to bump all the repo's versions to on a new branch (called `bump-versions-<version>`) after making a new release, e.g. 0.3.0-alpha.0. If empty, will not bump the versions."
        required: false
      bumpRef:
        description: 'Git ref to create the new `bump-versions-<version>` branch from. If empty, will use the current branch.'
        required: false
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  publish:
    name: Release on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./extension-repo

    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Output Workflow Dispatch Inputs
        working-directory: ./
        run: echo "${{ toJSON(github.event.inputs) }}"

      - name: Checkout git repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: extension-repo

      - name: Checkout paranext-core repo to use its sub-packages
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: paranext-core
          repository: paranext/paranext-core
          persist-credentials: false

      # No `ref` is pinned above, so this resolves to whatever the default branch HEAD is at run
      # time — it has been seen moving within hours. Recording it matters most here: without it a
      # published artifact carries no record of which core revision it was built against.
      - name: Record paranext-core revision
        working-directory: paranext-core
        shell: bash
        run: |
          echo "### paranext-core \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H%n%ad%n%s' --date=iso | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Read package.json
        id: package_json
        uses: zoexx/github-action-json-file-properties@d02f28167f05bf70cd75352b11c25a4e8c39bf38 # 1.0.6
        with:
          file_path: 'extension-repo/package.json'

      - name: Verify version (skips if versions match)
        if: '${{ inputs.version != steps.package_json.outputs.version }}'
        run: |
          echo "Version mismatch! Expected ${{ inputs.version }} but found ${{ steps.package_json.outputs.version }}"
          exit 1

      - name: Install Node and NPM
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: |
            extension-repo/package-lock.json
            paranext-core/package-lock.json
          node-version: ${{ fromJson(steps.package_json.outputs.volta).node }}

      - name: Install packages
        run: |
          # Cannot --omit=optional: lightningcss-linux-x64-gnu is an optional dep; Tailwind needs it
          # for the CSS build.
          npm ci --ignore-scripts

      - name: Install core packages
        working-directory: paranext-core
        run: |
          # Core is only checked out for its local npm packages; no core webpack build runs here.
          npm ci --ignore-scripts --omit=optional

      - name: Package for distribution
        run: |
          npm run package

      # `bodyFile` is copied verbatim and `omitBodyDuringUpdate` stops a re-run from refreshing it,
      # so the placeholders have to be correct the first time the release is created. The Paratext
      # 10 Studio build is versioned separately and attached by hand, so its version can only reach
      # the body through the `studioVersion` input.
      - name: Fill the versions into the release body
        shell: bash
        env:
          VERSION: ${{ steps.package_json.outputs.version }}
          STUDIO_VERSION: ${{ inputs.studioVersion }}
        run: |
          if ! grep -q 'interlinearizer_<version>\.zip' .github/assets/release-body.md; then
            echo 'Release body has no `interlinearizer_<version>.zip` placeholder to fill.'
            exit 1
          fi
          # Substitute into a copy outside the repo: `release-body.md` is tracked, and the
          # `Bump repo versions` step below fails on a dirty working tree.
          sed "s|interlinearizer_<version>\.zip|interlinearizer_${VERSION}.zip|g" \
            .github/assets/release-body.md > "${RUNNER_TEMP}/release-body.md"
          if [ -n "${STUDIO_VERSION}" ]; then
            if ! grep -q '<Studio version>' "${RUNNER_TEMP}/release-body.md"; then
              echo 'Release body has no `<Studio version>` placeholder to fill.'
              exit 1
            fi
            sed -i "s|<Studio version>|${STUDIO_VERSION}|g" "${RUNNER_TEMP}/release-body.md"
          else
            echo 'No `studioVersion` input given; leaving `<Studio version>` for a maintainer to fill in on the draft.'
          fi

      - name: Publish draft release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifactErrorsFailBuild: true
          artifacts: |
            extension-repo/release/*
          bodyFile: ${{ runner.temp }}/release-body.md
          # make the new release a draft instead of automatically publishing
          draft: true
          generateReleaseNotes: true
          # if the release already exists, leave its metadata alone
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          # make the new release a pre-release
          prerelease: true
          # tag+commit creates a version tag for this release with the tag name at the commit ref
          # so the GitHub Release doesn't have to create the tag and assume it is on `main`
          tag: v${{ inputs.version }}
          commit: ${{ github.head_ref || github.ref_name }}
          # only update if the release is still a draft
          updateOnlyUnreleased: true

      - name: Checkout bump ref
        if: ${{ inputs.newVersionAfterPublishing != '' && inputs.bumpRef != '' && inputs.bumpRef != (github.head_ref || github.ref_name) }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          clean: false
          path: extension-repo
          ref: ${{ inputs.bumpRef }}

      - name: Bump repo versions
        if: ${{ inputs.newVersionAfterPublishing != '' }}
        uses: ./extension-repo/.github/actions/bump-versions-action
        with:
          newVersion: ${{ inputs.newVersionAfterPublishing }}

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3.23
        with:
          limit-access-to-actor: true
