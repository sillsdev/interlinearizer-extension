name: Publish
run-name: Publish release v${{ github.event.inputs.version }} on ${{ github.head_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. For verification purposes only; if the package.json version is different on the specified branch, the workflow will fail.'
        required: true
      studioVersion:
        description: 'Version of the Paratext 10 build to attach to this release, e.g. 0.4.0-alpha.1. Fills the release body and names the installers to download.'
        required: true
      studioRunId:
        description: 'Run ID of the paranext/paratext-10-studio Package run that uploaded that build to S3, e.g. 35758007497.'
        required: true
      newVersionAfterPublishing:
        description: "Version to bump all the repo's versions to on a new branch (called `bump-versions-<version>`) after making a new release, e.g. 0.3.0-alpha.0. If empty, will not bump the versions."
        required: false
      bumpRef:
        description: 'Git ref to create the new `bump-versions-<version>` branch from. If empty, will use the current branch.'
        required: false
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  publish:
    name: Release on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./extension-repo

    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Output Workflow Dispatch Inputs
        working-directory: ./
        run: echo "${{ toJSON(github.event.inputs) }}"

      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension-repo

      - name: Checkout paranext-core repo to use its sub-packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: paranext-core
          repository: paranext/paranext-core
          persist-credentials: false

      # No `ref` is pinned above, so this resolves to whatever the default branch HEAD is at run
      # time — it has been seen moving within hours. Recording it matters most here: without it a
      # published artifact carries no record of which core revision it was built against.
      - name: Record paranext-core revision
        working-directory: paranext-core
        shell: bash
        run: |
          echo "### paranext-core \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H%n%ad%n%s' --date=iso | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Read package.json
        id: package_json
        uses: zoexx/github-action-json-file-properties@42c424cc2a0f9dfd36c79aedb70d429c0ae3e3fa # 1.0.7
        with:
          file_path: 'extension-repo/package.json'

      - name: Verify version (skips if versions match)
        if: '${{ inputs.version != steps.package_json.outputs.version }}'
        run: |
          echo "Version mismatch! Expected ${{ inputs.version }} but found ${{ steps.package_json.outputs.version }}"
          exit 1

      # The bucket cannot be listed, so each key is rebuilt from the Package workflow's naming.
      - name: Download the Paratext 10 installers
        working-directory: ./
        shell: bash
        env:
          STUDIO_VERSION: ${{ inputs.studioVersion }}
          STUDIO_RUN_ID: ${{ inputs.studioRunId }}
          BUCKET_URL: https://paratext-10-studio-releases.s3.us-east-2.amazonaws.com/paratext10studio
        run: |
          if ! [[ "${STUDIO_VERSION}" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::studioVersion is not a version: ${STUDIO_VERSION}"
            exit 1
          fi
          if ! [[ "${STUDIO_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::studioRunId is not a numeric run ID: ${STUDIO_RUN_ID}"
            exit 1
          fi
          base="${BUCKET_URL}/${STUDIO_VERSION}"
          mkdir studio-release
          download() {
            echo "Downloading $1"
            if ! curl --fail --location --retry 3 --silent --show-error -o "studio-release/$2" "$1"; then
              echo "::error::Could not download $1. Check the version and run ID against that Package run's 'Print S3 upload result' log; the installer names may have changed."
              exit 1
            fi
          }
          download "${base}/Windows/Paratext%2010%20Setup%20${STUDIO_VERSION}-${STUDIO_RUN_ID}.exe" "Paratext-10-Setup-${STUDIO_VERSION}.exe"
          download "${base}/macOS/Paratext%2010-${STUDIO_VERSION}-universal-${STUDIO_RUN_ID}.dmg" "Paratext-10-${STUDIO_VERSION}-universal.dmg"
          download "${base}/Linux/paratext-10-studio_${STUDIO_VERSION}_amd64-${STUDIO_RUN_ID}.snap" "paratext-10-studio_${STUDIO_VERSION}_amd64.snap"
          ls -l studio-release

      - name: Install Node and NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          cache-dependency-path: |
            extension-repo/package-lock.json
            paranext-core/package-lock.json
          node-version: ${{ fromJson(steps.package_json.outputs.volta).node }}

      # Our editor `file:` dependency points into core's gitignored `dev-packages/staging/`, which
      # only core's `preinstall` creates — and the core install below runs `--ignore-scripts`. npm
      # links a missing `file:` target silently, so skipping this leaves a broken symlink.
      - name: Stage paranext-core's dev packages
        working-directory: paranext-core
        run: npm run stage-dev-packages

      - name: Install packages
        run: |
          # Cannot --omit=optional: lightningcss-linux-x64-gnu is an optional dep; Tailwind needs it
          # for the CSS build.
          npm ci --ignore-scripts

      - name: Install core packages
        working-directory: paranext-core
        run: |
          # Core is only checked out for its local npm packages; no core webpack build runs here.
          npm ci --ignore-scripts --omit=optional

      # The staged packages come from the branch dev-packages.json pins, which moves independently
      # of core's commits, so the tree just installed can describe a different editor than core's
      # lockfile does. Core's postinstall makes this check; `--ignore-scripts` above skips it.
      - name: Verify core's staged dev packages match its lockfile
        working-directory: paranext-core
        run: npm run verify:dev-packages

      - name: Package for distribution
        run: |
          npm run package

      # `bodyFile` is copied verbatim and `omitBodyDuringUpdate` stops a re-run from refreshing it,
      # so the placeholders have to be correct the first time the release is created.
      - name: Fill the versions into the release body
        shell: bash
        env:
          VERSION: ${{ steps.package_json.outputs.version }}
          STUDIO_VERSION: ${{ inputs.studioVersion }}
        run: |
          if ! grep -q 'interlinearizer_<version>\.zip' .github/assets/release-body.md; then
            echo 'Release body has no `interlinearizer_<version>.zip` placeholder to fill.'
            exit 1
          fi
          if ! grep -q '/blob/v<version>/' .github/assets/release-body.md; then
            echo 'Release body has no `/blob/v<version>/` placeholder to fill; its doc links would not be pinned to this release.'
            exit 1
          fi
          # The body also names the Paratext 10 version in a line of its own, so this guard outlives
          # the temporary installer attachments; that is why Verify Release only warns when the body
          # names no installer.
          if ! grep -q '<Studio version>' .github/assets/release-body.md; then
            echo 'Release body has no `<Studio version>` placeholder; it would say nothing about which Paratext 10 build this release goes with.'
            exit 1
          fi
          # Substitute into a copy outside the repo: `release-body.md` is tracked, and the
          # `Bump repo versions` step below fails on a dirty working tree. `bodyFile` below is
          # therefore absolute where `artifacts` is not.
          # Pinning the INSTALL.md link to this tag keeps old releases on the docs they shipped with.
          sed -e "s|interlinearizer_<version>\.zip|interlinearizer_${VERSION}.zip|g" \
            -e "s|/blob/v<version>/|/blob/v${VERSION}/|g" \
            -e "s|<Studio version>|${STUDIO_VERSION}|g" \
            .github/assets/release-body.md > "${RUNNER_TEMP}/release-body.md"

      - name: Publish draft release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifactErrorsFailBuild: true
          artifacts: |
            extension-repo/release/*
            studio-release/*
          bodyFile: ${{ runner.temp }}/release-body.md
          # make the new release a draft instead of automatically publishing
          draft: true
          generateReleaseNotes: true
          # if the release already exists, leave its metadata alone
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          # make the new release a pre-release
          prerelease: true
          # tag+commit creates a version tag for this release with the tag name at the commit ref
          # so the GitHub Release doesn't have to create the tag and assume it is on `main`
          tag: v${{ inputs.version }}
          commit: ${{ github.head_ref || github.ref_name }}
          # only update if the release is still a draft
          updateOnlyUnreleased: true

      - name: Checkout bump ref
        if: ${{ inputs.newVersionAfterPublishing != '' && inputs.bumpRef != '' && inputs.bumpRef != (github.head_ref || github.ref_name) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          path: extension-repo
          ref: ${{ inputs.bumpRef }}

      - name: Bump repo versions
        if: ${{ inputs.newVersionAfterPublishing != '' }}
        uses: ./extension-repo/.github/actions/bump-versions-action
        with:
          newVersion: ${{ inputs.newVersionAfterPublishing }}

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true
