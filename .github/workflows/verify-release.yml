name: Verify Release
run-name: Verify release ${{ github.event.release.tag_name }}

# Publishing a draft fires `published`, which is the first point at which the manual parts of a
# release are checkable. `edited` re-runs the check so a corrected release can go green.
on:
  release:
    types: [published, edited]

permissions: {}

jobs:
  verify:
    name: Verify the manual release steps

    # `edited` fires for drafts too, and a draft's placeholders are meant to be unfilled until a
    # maintainer has worked through the release checklist.
    if: ${{ !github.event.release.draft }}

    runs-on: ubuntu-latest

    steps:
      # Everything checked here is in the release payload, so there is nothing to check out and no
      # token to grant. It reaches the script through the environment rather than by interpolation,
      # so release text cannot run as shell.
      - name: Check the install steps and the Paratext 10 Studio zip
        shell: bash
        env:
          BODY: ${{ github.event.release.body }}
          ASSET_NAMES: ${{ toJSON(github.event.release.assets.*.name) }}
        run: |
          failed=0

          if grep -qF '<Studio version>' <<< "${BODY}"; then
            echo '::error::The release body still has its `<Studio version>` placeholder. Replace it with the version of the Paratext 10 Studio zip attached below, so the install steps name a file that exists.'
            failed=1
          fi

          # The publish workflow fills these placeholders in, so they only survive on a release
          # whose body was copied from `.github/assets/release-body.md` by hand.
          if grep -qF 'interlinearizer_<version>.zip' <<< "${BODY}"; then
            echo '::error::The release body still has its `interlinearizer_<version>.zip` placeholder. Replace it with the version of the extension zip attached below, so the install steps name a file that exists.'
            failed=1
          fi
          if grep -qF '/blob/v<version>/' <<< "${BODY}"; then
            echo '::error::The release body still has its `/blob/v<version>/` placeholder, so its INSTALL.md link points at a tag that does not exist. Replace `v<version>` with the tag this release is on.'
            failed=1
          fi

          # Match the exact Studio zip file name the install steps give.
          # `|| true` else a no-match `grep` would abort the step under `set -e`.
          studio_zip="$(grep -oE 'Paratext\.10\.Studio\.Setup\.[^[:space:]`]+-Windows\.zip' <<< "${BODY}" | sed -n '1p' || true)"
          # Held in a variable, not piped: `grep -q` quitting early can SIGPIPE `jq` under `pipefail`.
          names="$(jq -r '.[]' <<< "${ASSET_NAMES}")"
          if [ -z "${studio_zip}" ]; then
            echo '::error::The release body names no Studio zip for testers to download in step 1.'
            failed=1
          elif ! grep -qxF "${studio_zip}" <<< "${names}"; then
            echo "::error::The Studio zip the release body names is not attached: ${studio_zip}"
            echo "Attached assets:"
            echo "${names}"
            failed=1
          fi

          exit "${failed}"
