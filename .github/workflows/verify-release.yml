name: Verify Release
run-name: Verify release ${{ github.event.release.tag_name }}

# Publishing a draft fires `published`, which is the first point at which the manual parts of a
# release are checkable. `edited` re-runs the check so a corrected release can go green.
on:
  release:
    types: [published, edited]

permissions: {}

jobs:
  verify:
    name: Verify the manual release steps

    # `edited` fires for drafts too, and a draft's placeholders are meant to be unfilled until a
    # maintainer has worked through the release checklist.
    if: ${{ !github.event.release.draft }}

    runs-on: ubuntu-latest

    steps:
      # Everything checked here is in the release payload, so there is nothing to check out and no
      # token to grant. It reaches the script through the environment rather than by interpolation,
      # so release text cannot run as shell.
      - name: Check the install steps and the attached zips
        shell: bash
        env:
          BODY: ${{ github.event.release.body }}
          ASSET_NAMES: ${{ toJSON(github.event.release.assets.*.name) }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          failed=0

          if grep -qF '<Studio version>' <<< "${BODY}"; then
            echo '::error::The release body still has its `<Studio version>` placeholder. Replace it with the version of the Paratext 10 Studio zip attached below, so the install steps name a file that exists.'
            failed=1
          fi

          # The publish workflow fills this placeholder in, so it only survives on a release whose
          # body was copied from `.github/assets/release-body.md` by hand.
          extension_placeholder=0
          if grep -qF 'interlinearizer_<version>.zip' <<< "${BODY}"; then
            echo '::error::The release body still has its `interlinearizer_<version>.zip` placeholder. Replace it with the version of the extension zip attached below, so the install steps name a file that exists.'
            extension_placeholder=1
            failed=1
          fi

          # Requiring the tag catches a body copied from a previous release, whose docs link
          # resolves and looks right while serving another version's instructions.
          if ! grep -qF "/blob/${RELEASE_TAG}/INSTALL.md" <<< "${BODY}"; then
            echo "::error::The release body's INSTALL.md link must point at /blob/${RELEASE_TAG}/INSTALL.md so these instructions stay with this release."
            failed=1
          fi

          # Held in a variable, not piped: `grep -q` quitting early would SIGPIPE `jq` under `pipefail`.
          names="$(jq -r '.[]' <<< "${ASSET_NAMES}")"
          unattached_zip=0

          # The extension zip is what the release exists to hand out, so a body naming one that is
          # not attached leaves every reader with nothing to install. An unfilled placeholder
          # satisfies the pattern below, so it is skipped rather than reported a second time as a
          # missing asset.
          if [ "${extension_placeholder}" -eq 0 ]; then
            # `|| true` else a no-match `grep` would abort the step under `set -e`.
            extension_zip="$(grep -oE 'interlinearizer_[^[:space:]`]+\.zip' <<< "${BODY}" | sed -n '1p' || true)"
            if [ -z "${extension_zip}" ]; then
              echo '::error::The release body names no Interlinearizer zip for testers to download.'
              failed=1
            elif ! grep -qxF "${extension_zip}" <<< "${names}"; then
              echo "::error::The Interlinearizer zip the release body names is not attached: ${extension_zip}"
              unattached_zip=1
              failed=1
            fi
          fi

          # The install steps offer both platforms, so a release missing either one sends half its
          # readers after a file that is not there.
          for platform in Windows Linux; do
            # Match the exact Studio zip file name the install steps give for this platform. The
            # pattern is spliced out of single quotes so its backtick stays literal.
            # `|| true` else a no-match `grep` would abort the step under `set -e`.
            studio_zip="$(grep -oE 'Paratext\.10\.Studio\.Setup\.[^[:space:]`]+-'"${platform}"'\.zip' <<< "${BODY}" | sed -n '1p' || true)"
            if [ -z "${studio_zip}" ]; then
              echo "::error::The release body names no ${platform} Studio zip for testers to download in step 1."
              failed=1
            elif ! grep -qxF "${studio_zip}" <<< "${names}"; then
              echo "::error::The ${platform} Studio zip the release body names is not attached: ${studio_zip}"
              unattached_zip=1
              failed=1
            fi
          done

          if [ "${unattached_zip}" -eq 1 ]; then
            echo "Attached assets:"
            echo "${names}"
          fi

          exit "${failed}"
