<!-- ===== callouts ===== -->
<text x="40" y="518" font-size="13.5" font-weight="600" fill="#111827">Why no lane can be derived from the one above it</text>

<g font-size="11.5" fill="#374151">
  <circle cx="50" cy="542" r="9" fill="#111827"/><text x="50" y="546" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="70" y="546"><tspan font-weight="600" fill="#111827">One segment, two chapters.</tspan> S1 merges LUK 1:&#8220;3-4&#8221; with the 2:0 superscription. Containment is therefore tested against <tspan font-family="ui-monospace, Consolas, monospace">segment.verseStarts</tspan>, never the</text>
  <text x="70" y="562">lexicographic <tspan font-family="ui-monospace, Consolas, monospace">startRef</tspan>&#8594;<tspan font-family="ui-monospace, Consolas, monospace">endRef</tspan> interval &#8212; which would over-claim every verse of chapter 1 above 3. &#8594; <tspan fill="#6b7280">src/utils/verse-ref.ts &#183; segmentContainsVerse</tspan></text>

  <circle cx="50" cy="592" r="9" fill="#111827"/><text x="50" y="596" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="70" y="596"><tspan font-weight="600" fill="#111827">One verse label, two verses.</tspan> The verbatim USJ label <tspan font-family="ui-monospace, Consolas, monospace">&#8220;3-4&#8221;</tspan> covers verses 3 and 4 &#8212; the separator may be an ASCII hyphen or any of U+2010&#8211;U+2015.</text>
  <text x="70" y="612">A label with no leading digits (a note-only marker) covers nothing at all. &#8594; <tspan fill="#6b7280">src/utils/verse-ref.ts &#183; parseVerseLabel / verseLabelCovers</tspan></text>

  <circle cx="50" cy="642" r="9" fill="#111827"/><text x="50" y="646" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="70" y="646"><tspan font-weight="600" fill="#111827">One verse, two segments.</tspan> A split leaves 2:1 in both S2 and S3 (S3&#8217;s verse start flagged <tspan font-family="ui-monospace, Consolas, monospace">isContinuation</tspan>). Both segments contain it, so the</text>
  <text x="70" y="662">anchor is the <tspan font-style="italic">first in document order</tspan> &#8212; S2. Character anchors are ignored, so every portion of a split verse matches. &#8594; <tspan fill="#6b7280">useSegmentWindow.ts &#183; findAnchorIndex</tspan></text>

  <circle cx="50" cy="692" r="9" fill="#111827"/><text x="50" y="696" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="70" y="696"><tspan font-weight="600" fill="#111827">One phrase, two groups.</tspan> P2 is discontiguous, so the measured window [g5..g9] is widened start-ward to g2, then re-scanned until stable.</text>
  <text x="70" y="712">An arc is drawn between two <tspan font-style="italic">mounted</tspan> boxes; leave one fragment out and the visible fragment loses its only phrase cue. &#8594; <tspan fill="#6b7280">ContinuousView.tsx &#183; groupSpanByPhraseId</tspan></text>
</g>

<line x1="40" y1="738" x2="1200" y2="738" stroke="#e5e7eb"/>
<g font-size="11" fill="#6b7280">
  <text x="40" y="760"><tspan font-weight="600" fill="#374151">Also note.</tspan> Punctuation tokens belong to no group: they sit in the link slots between groups (<tspan font-family="ui-monospace, Consolas, monospace">LinkSlot.punctuation</tspan>) or inside one (<tspan font-family="ui-monospace, Consolas, monospace">TokenGroup.punctuationBetween</tspan>).</text>
  <text x="40" y="778">Hence two order maps: <tspan font-family="ui-monospace, Consolas, monospace">tokenDocOrder</tspan> indexes word tokens only (13 here); <tspan font-family="ui-monospace, Consolas, monospace">fullTokenOrder</tspan> indexes all 16 &#8212; boundary refs can name punctuation, e.g. a cross-segment move target.</text>
  <text x="40" y="796">A phrase never crosses a segment boundary (<tspan font-family="ui-monospace, Consolas, monospace">forceBreakStraddledPhrases</tspan> splits any phrase a new boundary would cut), which is what keeps the widening loop bounded.</text>
  <text x="40" y="814">The two windows are independent and differently anchored: the segment window follows what is <tspan font-style="italic">visible</tspan> (scroll); the strip window follows the <tspan font-style="italic">focus</tspan>, and its size is measured from on-screen group pitch.</text>
</g>
<text x="40" y="836" font-size="9" fill="#9ca3af">interlinearizer-extension &#183; describes branch perf/continuous-view-responsiveness @ 0ab3de6 &#183; docs/navigation</text>
</svg>
