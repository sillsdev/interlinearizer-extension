  <text x="40" y="190">segments (index)</text>
  <text x="40" y="234">tokens (doc order)</text>
  <text x="40" y="294">phrase groups</text>
  <text x="40" y="376">segment window</text>
  <text x="40" y="417">strip render window</text>
  <text x="40" y="462">markers</text>
</g>

