<text x="40" y="40" font-size="20" font-weight="600" fill="#111827">Structure bands &#8212; where verse, segment, token, phrase and window disagree</text>
<text x="40" y="62" font-size="12.5" fill="#6b7280">One stretch of LUK, drawn to scale. Each lane is a different address space over the same text, and none of them nests cleanly inside the one above.</text>

