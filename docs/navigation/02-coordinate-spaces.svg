<rect width="1300" height="1030" fill="#ffffff"/>

<text x="40" y="40" font-size="20" font-weight="600" fill="#111827">Coordinate spaces &#8212; the same place has eight addresses</text>
<text x="40" y="62" font-size="12.5" fill="#6b7280">Three hub identities, their alternate encodings, and the function that converts between them. Red edges are lossy, partial, or one-to-many: those are the places where two call sites can legitimately disagree about where the user is.</text>

